apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
---
apiVersion: batch/v1
kind: Job
metadata:
  name: worker-shard-0
  namespace: pipeline
spec:
  template:
    metadata:
      labels:
        app: pipeline-worker
        shard: "0"
    spec:
      restartPolicy: OnFailure
      containers:
      - name: worker
        image: python:3.12-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install requests boto3
          python /scripts/worker.py
        env:
        - name: SHARD_INDEX
          value: "0"
        - name: SHARD_COUNT
          value: "2"
        - name: TEACHER_URL
          value: "http://host.k3d.internal:11434/api/generate"
        - name: S3_ENDPOINT
          value: "http://seaweedfs-s3.data.svc.cluster.local:8333"
        volumeMounts:
        - name: worker-scripts
          mountPath: /scripts
      volumes:
      - name: worker-scripts
        configMap:
          name: worker-script-config
---
apiVersion: batch/v1
kind: Job
metadata:
  name: worker-shard-1
  namespace: pipeline
spec:
  template:
    metadata:
      labels:
        app: pipeline-worker
        shard: "1"
    spec:
      restartPolicy: OnFailure
      containers:
      - name: worker
        image: python:3.12-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install requests boto3
          python /scripts/worker.py
        env:
        - name: SHARD_INDEX
          value: "1"
        - name: SHARD_COUNT
          value: "2"
        - name: TEACHER_URL
          value: "http://host.k3d.internal:11434/api/generate"
        - name: S3_ENDPOINT
          value: "http://seaweedfs-s3.data.svc.cluster.local:8333"
        volumeMounts:
        - name: worker-scripts
          mountPath: /scripts
      volumes:
      - name: worker-scripts
        configMap:
          name: worker-script-config

