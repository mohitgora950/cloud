apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-parser
  namespace: app
  labels:
    app: command-parser
spec:
  replicas: 2
  selector:
    matchLabels:
      app: command-parser
  template:
    metadata:
      labels:
        app: command-parser
    spec:
      containers:
      - name: command-parser
        image: command-parser:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: MODEL_URI
          value: "models/v2"
        - name: MODEL_VERSION
          value: "v2"
        - name: S3_ENDPOINT
          value: "http://seaweedfs-s3.data.svc.cluster.local:8333"
        - name: MAX_NEW_TOKENS
          value: "64"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 3"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
